[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "RAG system for vLLM codebase Q&A"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.6.0",
    "tqdm>=4.66",
    "bm25s>=0.2.0",
    "transformers>=4.40",
    "torch>=2.0",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
exclude = [".venv", "__pycache__", ".mypy_cache"]